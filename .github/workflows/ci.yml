name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Self-check — the demo must flag its planted phantom coverage
        run: |
          # La herramienta sale 1 A PROPÓSITO cuando detecta cobertura fantasma.
          # 'if' evita que ese exit intencional dispare el set -e del runner.
          if python -m coverage.cli --demo > /dev/null; then
            echo "self-check FALLÓ: el demo debía salir 1 (fantasma plantada)"; exit 1
          else
            echo "cobertura fantasma detectada como se esperaba"
          fi
