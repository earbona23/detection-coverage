name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Self-check — the demo must flag its planted phantom coverage
        run: |
          python -m coverage.cli --demo > /dev/null; test $? -eq 1 && echo "phantom coverage detected as expected"
